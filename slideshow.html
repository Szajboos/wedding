<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pokaz zdjęć — Wesele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #0B0B0A; overflow: hidden;
               font-family: 'Cormorant Garamond', Georgia, serif; }
  .stage { position: fixed; inset: 0; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
               opacity: 0; transition: opacity 1.2s ease; }
  .stage img.show { opacity: 1; }
  .hud { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
         padding: 22px 30px calc(env(safe-area-inset-bottom, 0px) + 22px);
         display: flex; justify-content: space-between; align-items: baseline;
         color: #F4EFE6; background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .hud .names { font-family: 'Alex Brush', cursive; font-size: clamp(1.6rem, 3.2vw, 2.6rem); }
  .hud .who { font-size: clamp(.9rem, 1.4vw, 1.1rem); letter-spacing: .04em; color: #D9D2C4; }
  .empty { position: fixed; inset: 0; display: grid; place-items: center; z-index: 1;
           color: #D9D2C4; font-size: 1.3rem; text-align: center; padding: 20px; }
  .fs-btn { position: fixed; top: 14px; z-index: 3; opacity: .35;
            background: rgba(255,255,255,.12); color: #F4EFE6; border: 0; border-radius: 8px;
            font: 14px system-ui, sans-serif; padding: 8px 12px; cursor: pointer; text-decoration: none; }
  .fs-btn:hover { opacity: .8; }
  #fs { right: 14px; }
  #exit { right: 108px; }
</style>
</head>
<body>

<div class="stage" id="stage"></div>
<div class="hud" id="hud" hidden>
  <span class="names" id="names"></span>
  <span class="who" id="who"></span>
</div>
<div class="empty" id="empty">Ładowanie zdjęć…</div>
<a class="fs-btn" id="exit" href="index.html">✕ Zamknij</a>
<button class="fs-btn" id="fs" type="button">Pełny ekran</button>

<script src="config.js"></script>
<script>
(function () {
  var CFG = window.WESELE_CONFIG || {};
  var API = String(CFG.apiUrl || '').trim();
  var INTERVAL = (CFG.slideshowIntervalSec || 6) * 1000;
  var REFRESH_MS = 60000;

  var items = [];
  var idx = -1;
  var paused = false;

  function $(s) { return document.querySelector(s); }

  function loadItems() {
    return fetch(API + '?action=config&_=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        if (!cfg.ok) throw new Error(cfg.error);
        // Tylko zdjecia — filmy pominiete: odtwarzanie w rotacji na czas
        // wymagaloby innej logiki (dlugosc, autoplay), a to ma byc niezawodne.
        var q = "'" + cfg.folderId + "' in parents and trashed=false and mimeType contains 'image/'";
        var params = 'q=' + encodeURIComponent(q) +
          '&orderBy=' + encodeURIComponent('createdTime desc') +
          '&pageSize=300&fields=' + encodeURIComponent('files(id,appProperties)');
        return fetch('https://www.googleapis.com/drive/v3/files?' + params, {
          headers: { Authorization: 'Bearer ' + cfg.token }
        }).then(function (r) { return r.json(); }).then(function (d) {
          items = d.files || [];
        });
      });
  }

  function showNext() {
    if (!items.length) return;
    idx = (idx + 1) % items.length;
    var f = items[idx];

    $('#empty').hidden = true;
    $('#hud').hidden = false;
    $('#names').textContent = CFG.coupleNames || '';
    $('#who').textContent = (f.appProperties && f.appProperties.guest) || '';

    var stage = $('#stage');
    var img = document.createElement('img');
    img.alt = '';
    img.src = 'https://drive.google.com/thumbnail?id=' + f.id + '&sz=w1920';
    img.onerror = function () { img.remove(); showNext(); };
    stage.appendChild(img);

    requestAnimationFrame(function () {
      requestAnimationFrame(function () { img.classList.add('show'); });
    });
    setTimeout(function () {
      while (stage.children.length > 1) stage.removeChild(stage.firstChild);
    }, 1300);
  }

  document.addEventListener('click', function (e) {
    if (e.target.id === 'fs' || e.target.id === 'exit') return;
    paused = !paused;
  });

  $('#fs').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(function () {});
  });

  $('#exit').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
  });

  function boot() {
    loadItems().then(function () {
      if (!items.length) { $('#empty').textContent = 'Jeszcze nic tu nie ma.'; return; }
      showNext();
    }).catch(function () {
      $('#empty').textContent = 'Nie udało się wczytać zdjęć.';
    });
  }

  if (!API || API.indexOf('script.google.com') < 0) {
    $('#empty').textContent = 'Brak adresu backendu — uzupełnij apiUrl w config.js';
  } else {
    boot();
    setInterval(function () { if (!paused) showNext(); }, INTERVAL);
    setInterval(loadItems, REFRESH_MS);
  }
})();
</script>
</body>
</html>
